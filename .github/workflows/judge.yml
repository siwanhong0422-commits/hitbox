name: 설문 AI 판별

# 설문 사이트(https://hitbox-siwan.web.app)에 들어온 장소를 10분마다 AI(Claude)가 기준대로 보고,
# 통과한 것만 힛박스 앱 지도(Firestore places)에 올린다. 결과는 제출 문서(submissions)에 적혀 사이트 완료 화면에 뜬다.
# 비밀값 두 개가 필요하다 (저장소 Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  파이어베이스 콘솔 → 프로젝트 설정 → 서비스 계정 → 새 비공개 키 (JSON 파일 내용 그대로)
#   ANTHROPIC_API_KEY         console.anthropic.com 의 API 키 (없으면 규칙으로 확실한 것만 거르고 나머지는 기다림)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: judge
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: AI 판별
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -jar server/hitbox-judge.jar
