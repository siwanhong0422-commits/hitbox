name: 설문 AI 판별

# 설문 사이트(https://hitbox-siwan.web.app)에 들어온 장소를 10분마다 AI(Google Gemini 무료 등급)가 기준대로 보고,
# 통과한 것만 힛박스 앱 지도(Firestore places)에 올린다. 결과는 제출 문서(submissions)에 적혀 사이트 완료 화면에 뜬다.
# 비밀값 (저장소 Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  판별기 전용 서비스 계정 키 JSON (역할: Cloud Datastore 사용자)
#   GEMINI_API_KEY            aistudio.google.com 에서 무료로 받은 키 (없으면 규칙으로 확실한 것만 거르고 나머지는 기다림)
# 손으로 돌릴 때 "selftest" 를 켜면 진짜 데이터는 안 건드리고 시험 제출로 AI 판정만 확인한다.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "AI 판정 시험만 (데이터 안 건드림)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: judge
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: server
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: AI 판별
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HITBOX_JUDGE_MODEL: ${{ vars.HITBOX_JUDGE_MODEL }}
        run: java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -jar server/hitbox-judge.jar ${{ inputs.selftest && 'selftest' || '' }}
