name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://kream.co.kr/products/627566"
          curl -s -o a.html -w "plain %{http_code}\n" "$U"
          curl -s -o b.html -w "mobileUA %{http_code}\n" -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/128.0 Mobile Safari/537.36" -H "Accept: text/html,application/xhtml+xml" -H "Accept-Language: ko-KR,ko;q=0.9" "$U"
          curl -s -o c.html -w "desktopUA %{http_code}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36" "$U"
          for f in a b c; do grep -o '"price":[0-9]*' $f.html | head -1; head -c 300 $f.html; echo; done
          curl -s -o /dev/null -w "api %{http_code}\n" "https://api.kream.co.kr/api/p/products/627566"
